info:
  name: Criar Interesse
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/v1/customers/{{customerId}}/availability-interests
  body:
    type: json
    data: |-
      {
        "appointmentId": "{{appointmentId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
