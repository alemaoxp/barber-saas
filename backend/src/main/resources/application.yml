spring:
  application:
    name: barber-saas-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/barberdb
    username: barber
    password: barber123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
        use_sql_comments: true

  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8080

# Development-only Web Push probe. Never enable these endpoints in production.
push:
  test:
    enabled: ${PUSH_TEST_ENABLED:false}
    vapid-public-key: ${PUSH_TEST_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${PUSH_TEST_VAPID_PRIVATE_KEY:}
    vapid-subject: ${PUSH_TEST_VAPID_SUBJECT:mailto:dev@localhost}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
