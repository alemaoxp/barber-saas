spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # The existing ApplicationRunner migrations must prepare the schema first.
      ddl-auto: validate

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGINS}

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
